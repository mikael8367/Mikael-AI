name: Mikael AI V1 Core Tests

on:
  push:
    branches: [mikael-ai-v1-core]
    paths:
      - "model-v1/**"
      - ".github/workflows/mikael-ai-v1-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model-v1/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Compile all Python files
        run: python -m py_compile mikael_ai_v1.py web_tools.py response_policy.py connectors.py coding_tools.py dataset_tools.py sft_train.py artifact_tools.py tests/test_model.py tests/test_web_tools.py tests/test_connectors_and_coding.py tests/test_sft_train.py tests/test_artifact_tools.py
