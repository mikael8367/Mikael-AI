name: Mikael AI App Tests

on:
  push:
    branches: [mikael-ai-v1-core]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "render.yaml"
      - ".github/workflows/mikael-ai-app-tests.yml"
  workflow_dispatch:

jobs:
  test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests scripts
      - name: Run app regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate frontend JavaScript and manifest
        run: |
          node --check app/static/app.js
          python -c "import json; json.load(open('app/static/manifest.webmanifest', encoding='utf-8'))"
