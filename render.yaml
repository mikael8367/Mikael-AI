services:
  - type: web
    name: mikael-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mikael-ai-db
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: LLM_REASONING_EFFORT
        value: high
      - key: MAX_UPLOAD_MB
        value: 8

databases:
  - name: mikael-ai-db
    plan: free
    databaseName: mikael_ai
    user: mikael_ai
