services:
  - type: web
    name: mikael-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m compileall -q app tests && python -m unittest discover -s tests
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mikael-ai-db
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: LLM_REASONING_EFFORT
        value: high
      - key: LLM_WEB_SEARCH_ENABLED
        value: true
      - key: LLM_WEB_SEARCH_ENGINE
        value: exa
      - key: LLM_WEB_SEARCH_MAX_RESULTS
        value: 5
      - key: MAX_UPLOAD_MB
        value: 8
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_SLUG
        value: mikael-ai-assistant
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: https://mikael-ai.onrender.com/api/connectors/github/callback
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

databases:
  - name: mikael-ai-db
    plan: free
    databaseName: mikael_ai
    user: mikael_ai
